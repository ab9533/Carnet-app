<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Carnet</title>
<meta name="theme-color" content="#FAF7F2" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Carnet" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #FAF7F2; color: #23252B; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 480px; margin: 0 auto; padding: 20px 16px 80px; }
  button, input, select, textarea { font-family: inherit; font-size: 14px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #A6635A !important; }

  .card { background: #fff; border: 1px solid #E3DDD2; border-radius: 10px; padding: 12px; }
  .input { width: 100%; border: 1px solid #E3DDD2; border-radius: 10px; padding: 9px 12px; background: #fff; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: #9CA3AF; margin-bottom: 8px; }
  .ghost-btn { display: flex; align-items: center; justify-content: center; gap: 6px; background: none; border: 1px dashed #C4B9AC; border-radius: 10px; padding: 8px 12px; font-size: 13px; color: #767b85; cursor: pointer; width: 100%; }
  .icon-btn { background: #fff; border: 1px solid #E3DDD2; border-radius: 10px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #23252B; }
  .row-gap { display: flex; flex-direction: column; gap: 8px; }
  .empty { font-size: 13px; color: #9CA3AF; padding: 10px 2px; }

  .header-eyebrow { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #9CA3AF; text-transform: uppercase; margin-bottom: 2px; }
  .header-date { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; text-transform: capitalize; }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .today-link { font-size: 12px; color: #5B4B8A; background: none; border: none; cursor: pointer; margin-top: 2px; }

  .tab-bar { display: flex; gap: 6px; margin-bottom: 20px; background: #F0ECE3; padding: 4px; border-radius: 12px; }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 9px; border: none; cursor: pointer; background: transparent; color: #767b85; font-size: 11px; font-weight: 500; }
  .tab-btn.active { background: #23252B; color: #FAF7F2; }

  .chip { display: flex; align-items: center; gap: 6px; background: #F3E7E4; border: 1px solid #E3C7C1; border-radius: 20px; padding: 5px 6px 5px 12px; font-size: 13px; }
  .chip-btn { background: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #A6635A; font-size: 11px; }

  .task-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #E3DDD2; border-radius: 10px; padding: 8px 10px; }
  .checkbox { width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; cursor: pointer; border-width: 2px; border-style: solid; }
  .trash-btn { background: none; border: none; cursor: pointer; color: #C4B9AC; font-size: 13px; }

  .timeline { position: relative; border: 1px solid #E3DDD2; border-radius: 12px; background: #fff; overflow: hidden; }
  .timeline-rule { position: absolute; left: 46px; top: 0; bottom: 0; width: 1px; background: #EFEAE0; }
  .hour-row { position: relative; height: 56px; border-top: 1px solid #EFEAE0; }
  .hour-row:first-child { border-top: none; }
  .hour-label { position: absolute; left: 8px; top: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9CA3AF; }
  .task-block { position: absolute; left: 52px; right: 8px; border-radius: 8px; padding: 4px 8px; font-size: 12.5px; font-weight: 500; cursor: pointer; overflow: hidden; display: flex; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .task-block.done { background: #F0ECE3; color: #9CA3AF; text-decoration: line-through; box-shadow: none; }
  .now-line { position: absolute; left: 0; right: 0; height: 2px; background: #A6635A; }
  .now-dot { position: absolute; left: 46px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #A6635A; }

  .tag-chip { padding: 5px 12px; border-radius: 20px; border: 1px solid #E3DDD2; cursor: pointer; font-size: 12px; background: #fff; color: #767b85; }
  .tag-chip.active { background: #23252B; color: #fff; border-color: #23252B; }
  .day-toggle { flex: 1; padding: 6px 0; border-radius: 8px; border: 1px solid #E3DDD2; cursor: pointer; background: #fff; color: #767b85; font-size: 12px; }
  .day-toggle.active { background: #2F6F5E; color: #fff; border-color: #2F6F5E; }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
